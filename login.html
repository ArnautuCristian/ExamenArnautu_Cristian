<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare</title>
    <link rel="stylesheet" href="./CSS/main.css">
</head>
<body>

    <div class="login-container">
        <h2>Autentificare</h2>
        <form action="#" method="POST">
            <div class="input-group">
                <label for="username">Nume utilizator</label>
                <input type="text" id="username" name="username" placeholder="Introduceti numele de utilizator" required>
            </div>
            <div class="input-group">
                <label for="password">Parolă</label>
                <input type="password" id="password" name="password" placeholder="Introduceti parola" required>
            </div>
            <button type="submit" class="btn-login">Autentifică-te</button>
            <div class="forgot-password">
                <a href="#">Ai uitat parola?</a>
            </div>
        </form>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare</title>
    <link rel="stylesheet" href="./CSS/main2.css">
</head>
<body>

    <div class="registration-container">
        <h2>Înregistrare</h2>
        <form action="#" method="POST">
            <div class="input-group">
                <label for="username">Nume utilizator</label>
                <input type="text" id="username" name="username" placeholder="Introduceti numele de utilizator" required>
            </div>
            <div class="input-group">
                <label for="email">Adresă de email</label>
                <input type="email" id="email" name="email" placeholder="Introduceti adresa de email" required>
            </div>
            <div class="input-group">
                <label for="password">Parolă</label>
                <input type="password" id="password" name="password" placeholder="Introduceti parola" required>
            </div>
            <div class="input-group">
                <label for="confirm-password">Confirmare parolă</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirmati parola" required>
            </div>
            <button type="submit" class="btn-register">Înregistrează-te</button>
            <div class="login-link">
                <p>Ai deja un cont? <a href="login.html">Autentifică-te</a></p>
            </div>
        </form>
    </div>

</body>
</html>
